skip_lfs: true

pre-commit:
  jobs:
    - name: oxlint
      glob: ["*.{ts,tsx,js,jsx}"]
      run: pnpm exec oxlint {staged_files}
      skip: [merge, rebase]

pre-push:
  piped: true
  jobs:
    - name: test
      run: pnpm test
    - name: git-lfs
      run: git lfs pre-push {0}
      use_stdin: true

post-checkout:
  jobs:
    - name: git-lfs
      run: git lfs post-checkout {0}

post-commit:
  jobs:
    - name: git-lfs
      run: git lfs post-commit {0}

post-merge:
  jobs:
    - name: git-lfs
      run: git lfs post-merge {0}
